services:
  # ----------------------------------------------------------------------------
  # Backend Web Service (FastAPI + Uvicorn)
  # ----------------------------------------------------------------------------
  - type: web
    name: skyguard-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: CORS_ORIGINS
        value: "*"
      - key: DATA_DIR
        value: ./data

  # ----------------------------------------------------------------------------
  # Frontend Static Site (React 18 + Vite)
  # ----------------------------------------------------------------------------
  - type: web
    name: skyguard-frontend
    runtime: static
    region: oregon
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: skyguard-backend
          property: host
